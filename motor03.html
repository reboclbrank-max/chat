<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧬 CÉLULA 03 RÁPIDA — responde voando (sem token)</title>
<style>
:root{--fundo:#0a0e14;--painel:#111823;--borda:#1f2b3a;--texto:#dce6f2;--dim:#7d8fa5;--casa:#39d98a;--enxame:#f5b83d;--sint:#5ec8f8;--erro:#e06060}
*{box-sizing:border-box;margin:0}
body{background:var(--fundo);color:var(--texto);font:15px/1.55 system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--borda);background:var(--painel);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px}
header .sub{color:var(--dim);font-size:12px}
.sel{background:var(--fundo);color:var(--texto);border:1px solid var(--borda);border-radius:8px;padding:6px 10px;font-size:13px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.b{max-width:88%;padding:9px 13px;border-radius:13px;white-space:pre-wrap;word-break:break-word}
.b.usuario{align-self:flex-end;background:#1c3a5e;border-bottom-right-radius:4px}
.b.celula{align-self:flex-start;background:var(--painel);border:1px solid var(--borda);border-bottom-left-radius:4px}
.b.asa{align-self:flex-start;background:#141a24;border:1px dashed #2a3a4f;color:var(--dim);font-size:13px;max-width:80%}
.b.sintese{align-self:flex-start;background:#10202e;border:1px solid var(--sint);border-bottom-left-radius:4px}
.b .origem{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
#rodape{padding:10px 12px;border-top:1px solid var(--borda);background:var(--painel);display:flex;gap:8px}
#e{flex:1;background:var(--fundo);color:var(--texto);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;resize:none;font:inherit;max-height:120px}
button{background:#182840;color:var(--texto);border:1px solid #2a4060;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}
button:hover{background:#203352}
button.principal{background:#123a28;border-color:var(--casa)}
.mini{padding:4px 9px;font-size:12px;border-radius:7px}
#status{color:var(--dim);font-size:12px;padding:0 16px 6px}
a{color:var(--sint)}
</style>
</head>
<body>
<header>
  <h1><h1>🧬 CÉLULA 03 <small style="color:var(--dim)">RÁPIDA</small></h1></h1>
  <span class="sub">RÁPIDA · responde voando · 10+10=20 · <a href="motor.html">01</a><a href="motor02.html">02</a><a href="motor03.html">03</a><a href="motor04.html">04</a></span>
  <select id="modo" class="sel">
    <option value="enxame">🐝 Enxame 10+10 (2 respondem + 1 sintetiza)</option>
    <option value="simples">⚡ Simples (1 motor)</option>
  </select>
  <button id="bLocal" class="mini" title="tenta rodar um modelo DENTRO do navegador (WebGPU)">🧠 cérebro local</button>
  <button id="bDna" class="mini">🧬 !dna</button>
</header>
<div id="log"></div>
<div id="status">carregando DNA da casa…</div>
<div id="rodape">
  <textarea id="e" rows="1" placeholder="fala com a célula… ( !plantar base|modelo|nome · !dna · !status )"></textarea>
  <button id="bEnviar" class="principal">Enviar</button>
</div>
<script>
'use strict';
const CELULA = { ids: ["llm7", "llm7glm", "ovhq", "ovhq9"] };
const DNA_URL = 'https://raw.githubusercontent.com/reboclbrank-max/chat/main/dna.json';
const $ = s => document.querySelector(s);
let FROTA = [], LOCAL = null, LOCAL_PRONTO = false;

function bolha(tipo, texto, origem){
  const d = document.createElement('div');
  d.className = 'b ' + tipo;
  d.innerHTML = (origem ? '<span class="origem">' + origem + '</span>' : '') + texto.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
  $('#log').appendChild(d); $('#log').scrollTop = $('#log').scrollHeight;
  return d;
}
function status(t){ $('#status').textContent = t; }

async function carregarDNA(){
  let dna = [];
  try { const j = await (await fetch(DNA_URL, {cache:'no-store'})).json(); dna = j.motores || []; } catch(e){}
  let extras = [];
  try { extras = JSON.parse(localStorage.getItem('celula_frota') || '[]'); } catch(e){}
  const todos = dna.concat(extras);
  const vistos = new Set();
  FROTA = todos.filter(m => m && m.base && m.modelo && !vistos.has(m.base + '|' + m.modelo) && vistos.add(m.base + '|' + m.modelo));
  if (CELULA.ids) FROTA = FROTA.filter(m => CELULA.ids.includes(m.id) || (m.id || '').startsWith('x'));
  status(FROTA.length + ' motores no DNA' + (extras.length ? ' (+' + extras.length + ' plantados aqui)' : '') + ' · modo: ' + ($('#modo').value === 'enxame' ? 'enxame 10+10' : 'simples'));
}

async function pinga(m){
  const t0 = Date.now();
  try{
    const r = await fetch(m.base + '/chat/completions', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({model:m.modelo, messages:[{role:'user',content:'ping'}], max_tokens:4}), signal: AbortSignal.timeout(12000)});
    return {ok: r.ok, ms: Date.now() - t0};
  }catch(e){ return {ok:false, ms:Date.now()-t0}; }
}
async function falaMotor(m, mensagens, temp){
  try{
    const r = await fetch(m.base + '/chat/completions', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({model:m.modelo, messages:mensagens, temperature:temp||0.7, max_tokens:600}), signal: AbortSignal.timeout(90000)});
    if(!r.ok) return null;
    const j = await r.json();
    return ((((j.choices||[])[0]||{}).message||{}).content || '').trim() || null;
  }catch(e){ return null; }
}
async function vivosDaFrota(qtd){
  const vivos = [];
  for(const m of FROTA){
    if (vivos.length >= qtd) break;
    const p = await pinga(m);
    if (p.ok) vivos.push({m, ms:p.ms});
  }
  vivos.sort((a,b)=>a.ms-b.ms);
  return vivos;
}
const PROMPT_SINT = 'Você é o síntese da CÉLULA RÁPIDA. Recebe DUAS respostas de motores velozes e produz UMA final: CURTA, direta e essencial — sem enrolação, sem preâmbulo, em português claro. Não comente o processo.';

async function responder(pergunta){
  if (LOCAL_PRONTO && LOCAL){
    bolha('celula', '…', '🧠 cérebro local (no seu aparelho, sem internet)');
    try{
      const chunks = [];
      const eng = await LOCAL.chat.completions.create({messages:[{role:'user',content:pergunta}], stream:true, temperature:0.7});
      const alvo = $('#log').lastChild;
      for await (const c of eng){ const t = c.choices[0]?.delta?.content || ''; if(t){ chunks.push(t); alvo.innerHTML = (alvo.querySelector('.origem')?.outerHTML||'') + chunks.join('').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>'); $('#log').scrollTop=$('#log').scrollHeight; } }
      status('respondido pelo cérebro local');
    }catch(e){ bolha('asa', 'cérebro local falhou: ' + e, '🧠'); }
    return;
  }
  const vivos = await vivosDaFrota(3);
  if(!vivos.length){ bolha('celula', 'nenhum motor vivo agora — a casa vai re-provar no próximo ciclo. Tente de novo em instantes.', '🧬'); return; }
  status(vivos.map(v=>v.m.nome+' '+v.ms+'ms').join(' · '));
  if ($('#modo').value === 'enxame' && vivos.length >= 2){
    const [a,b] = vivos;
    const pa = falaMotor(a.m, [{role:'user',content:pergunta}], 0.7);
    const pb = falaMotor(b.m, [{role:'user',content:pergunta}], 0.9);
    const ra = await pa, rb = await pb;
    if(ra) bolha('asa', ra.slice(0,900) + (ra.length>900?'…':''), '🐝 asa A — ' + a.m.nome + ' (' + a.ms + 'ms)');
    if(rb) bolha('asa', rb.slice(0,900) + (rb.length>900?'…':''), '🐝 asa B — ' + b.m.nome + ' (' + b.ms + 'ms)');
    const sint = vivos.find(v=>v!==a&&v!==b) || a;
    const mensagens = [{role:'system',content:PROMPT_SINT},
      {role:'user',content:'PERGUNTA: ' + pergunta + '\n\nRESPOSTA A (' + a.m.nome + '): ' + (ra||'(sem resposta)') + '\n\nRESPOSTA B (' + b.m.nome + '): ' + (rb||'(sem resposta)') + '\n\nProduza a RESPOSTA FINAL unida.'}];
    const fin = await falaMotor(sint.m, mensagens, 0.4);
    bolha('sintese', fin || (ra||rb||'asas mudas — tente de novo'), '⚡ 10+10=20 · síntese por ' + sint.m.nome);
  } else {
    const r = await falaMotor(vivos[0].m, [{role:'user',content:pergunta}], 0.7);
    bolha('celula', r || 'motor mudou — tente de novo', '🧬 ' + vivos[0].m.nome);
  }
}

function comando(txt){
  if (txt.startsWith('!dna')){
    bolha('celula', '🧬 DNA: ' + FROTA.length + ' motores\n' + FROTA.map(m=>'• ' + m.nome + ' — ' + m.base).join('\n') + '\n\nFrota completa publicada em chat/dna.json — toda célula nova nasce com ela.', '🧬');
    return true;
  }
  if (txt.startsWith('!status')){
    bolha('celula', '🧬 CÉLULA 01 · motores: ' + FROTA.length + ' · modo: ' + $('#modo').value + ' · cérebro local: ' + (LOCAL_PRONTO ? 'ATIVO' : ('x')) + ' · tokens necessários: ZERO', '🧬');
    return true;
  }
  if (txt.startsWith('!plantar ')){
    const p = txt.slice(9).split('|').map(s=>s.trim());
    if(!/^https:\/\//.test(p[0]||'') || !p[1]) { bolha('celula','⚠️ uso: !plantar https://base | modelo | nome','🧬'); return true; }
    let ex = []; try{ ex = JSON.parse(localStorage.getItem('celula_frota')||'[]'); }catch(e){}
    ex.push({id:'x'+Date.now().toString(36), nome:p[2]||p[1], base:p[0], modelo:p[1]});
    localStorage.setItem('celula_frota', JSON.stringify(ex.slice(-12)));
    carregarDNA(); bolha('celula','🌱 plantado: ' + (p[2]||p[1]) + ' — já entra na próxima resposta.', '🧬');
    return true;
  }
  if (txt.startsWith('!familia')){ bolha('celula','🧬 FAMÍLIA CÉLULA — 4 irmãs, um só DNA: motor.html (01 geral) · motor02.html (02 SÁBIA) · motor03.html (03 RÁPIDA) · motor04.html (04 ENXAME-MÁXIMO). Links no topo da tela. DNA atual: chat/dna.json', '🧬'); return true; }
  return false;
}

async function ligarLocal(){
  if (LOCAL_PRONTO){ bolha('celula','🧠 cérebro local já ativo — as respostas saem do SEU aparelho.','🧬'); return; }
  if (!('gpu' in navigator) && !navigator.xr){ bolha('asa','seu navegador não tem WebGPU — a célula segue nas asas keyless (sem token). Tente no Chrome/Edge atualizado de PC.','🧠'); return; }
  bolha('asa','baixando cérebro local (modelo pequeno ~450MB, uma única vez; fica gravado no navegador)…','🧠');
  try{
    const webllm = await import('https://esm.run/@mlc-ai/web-llm');
    LOCAL = new webllm.MLCEngine();
    await LOCAL.reload('Qwen2.5-0.5B-Instruct-q4f16_1-MLC', {progressCallback: p => status('🧠 baixando: ' + Math.round((p.progress||0)*100) + '%')});
    LOCAL_PRONTO = true;
    bolha('celula','🧠 CÉREBRO LOCAL LIGADO — a célula agora pensa DENTRO do seu aparelho. ZERO rede, ZERO token. Botão volta ao normal pra desligar… (recarregue a página p/ desligar)','🧬');
    $('#bLocal').textContent = '🧠 local ATIVO';
  }catch(e){ bolha('asa','WebGPU indisponível ou download falhou (' + (e.message||e) + '). Seguindo nas asas keyless — sem token.','🧠'); }
}

$('#bEnviar').onclick = enviar;
$('#e').addEventListener('keydown', ev => { if(ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); enviar(); } });
$('#bLocal').onclick = ligarLocal;
$('#bDna').onclick = () => comando('!dna');
$('#modo').onchange = carregarDNA;
function enviar(){
  const t = $('#e').value.trim(); if(!t) return;
  $('#e').value=''; bolha('usuario', t, null);
  if (comando(t.toLowerCase())) return;
  responder(t);
}
bolha('celula','🧬 **CÉLULA 03 RÁPIDA acordou.**\nSó os velocistas moram aqui: LLM7 ×2, Qwen-27B, Qwen-9B.\nPerguntou, voou. Respostas curtas e na hora.\nComandos: !status · !dna · !familia · !plantar','🧬');
carregarDNA();
</script>
</body>
</html>
