name: Testes rápidos do chat (barreira antes de entrar no ar)
# 🚦 roda a cada mudança de código do chat; o escutador (v4.3) só troca o turno se este teste passar.
# Sem Gmail e sem IA de verdade: IMAP, SMTP e motores falsos (tools/testes/simula-caixa.js).
on:
  push:
    branches: [main]
    paths:
      - 'tools/email-chat.js'
      - 'tools/email-poll.js'
      - 'tools/telegram-chat.js'
      - 'tools/prepara-foto.py'
      - 'tools/visao-local.py'
      - 'tools/ocr-local.py'
      - 'tools/olho.py'
      - 'tools/transcreve.py'
      - 'index.html'
      - 'direto.html'
      - 'ligar.html'
      - 'limpar.html'
      - 'chat-estilos.css'
      - 'chat-pwa.js'
      - 'console.html'
      - 'sw.js'
      - 'dna.json'
      - 'tools/testes/**'
      # Toda ferramenta executável também pode mudar o comportamento do Chat;
      # assim a porta de continuidade roda para qualquer JS/Python/Shell em tools/.
      - 'tools/**/*.js'
      - 'tools/**/*.py'
      - 'tools/**/*.sh'
      - 'CONTINUIDADE.md'
      - 'AUTONOMIA.md'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testes-rapidos-${{ github.sha }}
jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Bibliotecas (as mesmas versões do turno)
        run: |
          npm install --no-save imapflow@2.4.3 nodemailer@10.1.1
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages "numpy<2.5" Pillow pillow-heif==1.8.1 openpyxl==3.1.5 pypdf || python3 -m pip install --quiet --disable-pip-version-check Pillow pillow-heif==1.8.1 openpyxl==3.1.5 pypdf
          # A suíte exercita OCR e PDF digitalizado; não depende da imagem Ubuntu
          # já trazer o renderizador Poppler nem o idioma português do Tesseract.
          faltam=""
          if ! command -v pdftotext >/dev/null || ! command -v pdftoppm >/dev/null; then
            faltam="$faltam poppler-utils"
          fi
          if ! tesseract --list-langs 2>/dev/null | grep -qx por; then
            faltam="$faltam tesseract-ocr tesseract-ocr-por"
          fi
          if [ -n "$faltam" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq $faltam
          fi
      - name: Sintaxe
        run: |
          for f in tools/email-chat.js tools/email-poll.js tools/fila-turno.js tools/pulso-vigia.js tools/reserva-turno.js tools/falhas-mensagem.js tools/turno-liveness.js tools/telegram-chat.js tools/teste-email.js tools/teste-qualidade-profunda.js tools/avaliacao-profunda-casos.js tools/testes/*.js; do node --check "$f"; done
          for f in tools/prepara-foto.py tools/visao-local.py tools/ocr-local.py tools/olho.py; do python3 -m py_compile "$f"; done
          for f in tools/testes/*.sh; do bash -n "$f"; done
      - name: Testes rápidos (IMAP, SMTP e motores falsos)
        env:
          REBOCL_EXIGIR_MULTIMODAL: '1'
        run: node tools/testes/roda-testes.js
