name: Testar todas as APIs
# 🧪 Testa se cada credencial de rede social e serviço ainda funciona.
# Roda a cada 6h e via workflow_dispatch (1 clique).
# Não modifica nada — só faz chamadas de LEITURA.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: testar-apis
  cancel-in-progress: false
jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Instala imapflow para teste de Gmail
        run: npm install imapflow --omit=dev --no-audit --no-fund
      - name: Testa todas as APIs
        run: node tools/testar-todas-as-apis.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ITCH_API_KEYS: ${{ secrets.ITCH_API_KEYS }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APPPASS: ${{ secrets.BLUESKY_APPPASS }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          NOSTR_KEY: ${{ secrets.NOSTR_KEY }}
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDR }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
