name: Diagnóstico da caixa (somente leitura)
# 🔍 1 clique: mostra pastas, marcação de lido e etiquetas dos e-mails de TESTE das últimas 6 h. Não lê conteúdo e
# não altera nada; o log é público, então só aparecem assuntos [TESTE-REBOCL] e nenhum endereço.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  olha:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: node tools/diagnostico-caixa.js
        env:
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDR }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
