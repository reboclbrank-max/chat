name: Teste do chat por e-mail (autoavaliação)
on:
  workflow_dispatch:
    inputs:
      espera:
        description: 'minutos de espera pelas respostas'
        required: false
        default: '25'
      script:
        description: 'qual teste rodar'
        required: false
        default: 'tools/teste-email.js'
permissions:
  contents: write
concurrency:
  group: teste-email
  cancel-in-progress: false
jobs:
  teste:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm install --no-save imapflow@2.4.3 nodemailer@10.1.1
      - name: Arquivos de prova gerados na hora (foto de ~6 MB, HEIC, nota de voz, planilha, PDF escaneado)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages Pillow pillow-heif==1.8.1 gTTS openpyxl==3.1.5 || python3 -m pip install --quiet --disable-pip-version-check Pillow pillow-heif==1.8.1 gTTS openpyxl==3.1.5 || true
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) || true   # vídeo e nota de voz .ogg
          python3 tools/gerar-fixtures.py || echo "⚠️ fotos de prova não geradas"
      - name: Envia o teste e captura as respostas
        run: |
          SCRIPT="${{ github.event.inputs.script }}"
          case "$SCRIPT" in tools/teste-email.js|tools/teste-memoria.js|tools/teste-foto.js|tools/teste-voz.js|tools/teste-anexos.js|tools/teste-navegador-pareado.js|tools/teste-qualidade-profunda.js) ;; *) SCRIPT=tools/teste-email.js ;; esac
          echo "rodando $SCRIPT"
          node "$SCRIPT"
        env:
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDR }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
          ESPERA_MIN: ${{ github.event.inputs.espera }}
      - name: Publica o relatório somente no ramo revisável
        if: always()
        run: |
          set -euo pipefail
          git config user.name "teste-email"
          git config user.email "teste@rebocl.local"
          git add -- provas/
          if git diff --cached --quiet; then
            echo "teste sem relatório novo"
          else
            node tools/estado-operacional-controlado.js publicar teste-email
          fi
