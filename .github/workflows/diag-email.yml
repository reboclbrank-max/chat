name: Diagnóstico da caixa de e-mail (interno)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diag-email
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save imapflow@2.4.3 nodemailer@10.1.1
      - run: node tools/diag-email.js
        env:
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDR }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
