name: Coleta das respostas do teste (interno)
on:
  workflow_dispatch:
    inputs:
      espera:
        description: 'minutos de espera pelas respostas novas'
        required: false
        default: '8'
permissions:
  contents: write
concurrency:
  group: diag-email
  cancel-in-progress: false
jobs:
  coleta:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm install --no-save imapflow@2.4.3 nodemailer@10.1.1
      - name: Coleta e sonda
        run: node tools/coleta-respostas.js
        env:
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDR }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
          ESPERA_MIN: ${{ github.event.inputs.espera }}
      - name: Publica a coleta somente no ramo revisável
        if: always()
        run: |
          set -euo pipefail
          git config user.name "coleta-email"
          git config user.email "coleta@rebocl.local"
          git add -- provas/
          if git diff --cached --quiet; then
            echo "coleta sem prova nova"
          else
            node tools/estado-operacional-controlado.js publicar coleta
          fi
