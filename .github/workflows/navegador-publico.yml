name: Navegador público isolado
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL pública http(s), sem login (ex.: https://example.com)"
        required: true
        type: string
      referencia:
        description: "Identificador opaco de retorno (sem destinatário ou segredo)"
        required: false
        default: ''
        type: string
permissions:
  contents: write
concurrency:
  group: navegador-publico
  cancel-in-progress: false
jobs:
  navegar:
    # Não recebe segredos de e-mail, Telegram, IA ou marketing. O Chrome roda antes da etapa de push.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Abre somente conteúdo público, sem perfil e sem segredos
        env:
          URL_PUBLICA: ${{ inputs.url }}
          REFERENCIA_NAVEGACAO: ${{ inputs.referencia }}
        run: |
          set -euo pipefail
          node tools/navegador-publico.js --url "$URL_PUBLICA" > /tmp/navegador-resultado.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/navegador-resultado.json', 'utf8'));
          // Só um ID aleatório e opaco pode cruzar o isolamento; nunca destinatário, thread ou segredo de canal.
          const referencia = String(process.env.REFERENCIA_NAVEGACAO || '');
          if (referencia && !/^nav-[a-f0-9]{24}$/.test(referencia)) throw new Error('referência de retorno inválida');
          // Registra só metadados públicos resumidos; nunca HTML integral, cookies ou credenciais.
          const estado = { consultado_em: r.consultadoEm, url: r.url, via: r.via, titulo: r.titulo, trecho_publico: r.texto.slice(0, 500), aviso: r.aviso || '' };
          if (referencia) estado.referencia = referencia;
          fs.writeFileSync('navegador-estado.json', JSON.stringify(estado, null, 2) + '\n');
          console.log('Página pública consultada:', estado.titulo);
          NODE
      - name: Salva a trilha pública depois da navegação
        # O token só existe nesta etapa posterior ao Chrome e via cabeçalho HTTP, nunca em URL/config/log.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const token = process.env.GITHUB_TOKEN;
          const repo = process.env.REPOSITORIO;
          const nome = 'navegador-estado.json';
          const cabecalhos = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          async function salva() {
            for (let tentativa = 1; tentativa <= 3; tentativa++) {
              const atual = await fetch(`https://api.github.com/repos/${repo}/contents/${nome}?ref=main`, { headers: cabecalhos });
              let anterior, anteriorEstado = {};
              if (atual.ok) {
                const antigo = await atual.json();
                anterior = antigo.sha;
                try { anteriorEstado = JSON.parse(Buffer.from(String(antigo.content || ''), 'base64').toString('utf8')); } catch (e) {}
              } else if (atual.status !== 404) throw new Error(`leitura do estado HTTP ${atual.status}`);
              const estado = JSON.parse(fs.readFileSync(nome, 'utf8'));
              // O histórico curto evita que duas consultas enfileiradas percam o retorno; contém só o mesmo resumo público.
              if (estado.referencia) {
                const item = Object.assign({}, estado);
                const anteriores = Array.isArray(anteriorEstado.resultados_recentes) ? anteriorEstado.resultados_recentes : [];
                estado.resultados_recentes = [item].concat(anteriores.filter(x => x && x.referencia !== item.referencia)).slice(0, 6);
              } else if (Array.isArray(anteriorEstado.resultados_recentes)) estado.resultados_recentes = anteriorEstado.resultados_recentes.slice(0, 6);
              const conteudo = Buffer.from(JSON.stringify(estado, null, 2) + '\n').toString('base64');
              const r = await fetch(`https://api.github.com/repos/${repo}/contents/${nome}`, {
                method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, cabecalhos),
                body: JSON.stringify({ message: `navegador: consulta publica ${new Date().toISOString().slice(0, 16)}`, content: conteudo, branch: 'main', sha: anterior })
              });
              if (r.ok) return;
              if (r.status === 409 && tentativa < 3) continue;
              throw new Error(`gravação do estado HTTP ${r.status}`);
            }
          }
          salva().then(() => console.log('trilha pública salva')).catch(e => { console.error(e.message); process.exit(1); });
          NODE
