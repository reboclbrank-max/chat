name: Mesclador estreito (degrau 3)
# 🚦 A máquina mescla SOZINHA, mas só texto em docs/ e posts/, e só com a barreira verde.
# Se a main ficar vermelha depois de um merge dele, ele abre a PR de reversão — e ela
# passa pela mesma barreira. Nunca há push direto na main e nunca há merge sem teste verde.
on:
  workflow_run:
    workflows: ["Testes rápidos do chat (barreira antes de entrar no ar)"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  # `actions: read` não basta para pedir a barreira depois do merge: dispatch exige write.
  # Descoberto na prática (06/11): o log do job mostrou "HTTP 403 Resource not accessible
  # by integration" na hora de pedir, e a barreira da main continuou sem rodar.
  actions: write
concurrency:
  group: mesclador-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  mesclar:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Avalia a faixa e mescla (só texto, só com barreira verde)
        run: node tools/mesclador-estreito.js avaliar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ATOR: ${{ github.event.workflow_run.actor.login }}
  sombra:
    # Modo sombra: roda em TODA PR que passa pela barreira, verde ou vermelha, e só anota
    # o que o degrau 4 faria. Não mescla, não abre PR, não toca em main — o registro vai
    # para o ramo sombra/registro.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Anota o que o degrau 4 faria (sem fazer)
        run: node tools/sombra.js decidir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BARREIRA: ${{ github.event.workflow_run.conclusion }}
  reverter:
    # ⚠️ `push` sozinho não bastava: merge feito com o GITHUB_TOKEN do robô não gera evento
    # de push, então a barreira da main só existe se o próprio mesclador a pedir (dispatch).
    # Aceitar os dois eventos é o que faz a reversão ter o que escutar.
    if: (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Abre a reversão do merge que quebrou (sem push direto)
        run: node tools/mesclador-estreito.js reverter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
