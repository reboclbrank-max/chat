name: Vigia da casa (24h grátis)
on:
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
    inputs:
      teste:
        description: "manda um e-mail de teste ao dono"
        type: string
        default: 'nao'
permissions:
  contents: write
  actions: write
# Evita duas sondas concorrentes disputando IMAP, estado e push quando o turno pede vigia perto do cron.
concurrency:
  group: vigia-casa
  cancel-in-progress: false
jobs:
  vigia:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm install --no-save nodemailer@10.1.1 imapflow@2.4.3
      - run: node tools/vigia-casa.js
        env:
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDR }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
          VIGIA_PARA: ${{ secrets.CHAT_DONO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIGIA_TESTE: ${{ inputs.teste }}
      - name: Salva o estado do vigia
        if: always()
        run: |
          git config user.name "vigia-casa"
          git config user.email "vigia@rebocl.local"
          git add vigia-estado.json || true
          git diff --cached --quiet || git commit -m "vigia: estado $(date -u +%F-%H%M)"
          ok=0
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main || true
            if git push; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = "1" ] || echo "push sem mudanças ou falhou"
