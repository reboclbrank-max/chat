name: Vigia da casa (24h grátis)
on:
  schedule:
    - cron: '12,27,42 * * * *'
  workflow_dispatch:
    inputs:
      teste:
        description: "manda um e-mail de teste ao dono"
        type: string
        default: 'nao'
      cadeia:
        description: "encadeia a próxima rodada (sim/nao)"
        type: string
        default: 'sim'
      cadeia_min:
        description: "minutos até a próxima rodada da corrente"
        type: string
        default: '17'
permissions:
  contents: write
  actions: write
jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save nodemailer@10.1.1 imapflow@2.4.3
      - run: node tools/vigia-casa.js
        env:
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDR }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIGIA_TESTE: ${{ inputs.teste }}
          VIGIA_CADEIA: ${{ inputs.cadeia }}
          VIGIA_CADEIA_MIN: ${{ inputs.cadeia_min }}
      - name: Salva o estado do vigia
        run: |
          git config user.name "vigia-casa"
          git config user.email "vigia@rebocl.local"
          git add vigia-estado.json || true
          git diff --cached --quiet || git commit -m "vigia: estado $(date -u +%F-%H%M)"
          ok=0
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main || true
            if git push; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = "1" ] || echo "push sem mudanças ou falhou"
