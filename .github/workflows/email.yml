name: Chat por email (24h vivo)
on:
  schedule:
    - cron: '7 */6 * * *'
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
# A reserva agendada nunca entra na fila dos leitores: ela apenas coordena um novo turno quando
# a API confirma que não existe outro. Os turnos que realmente leem a caixa seguem serializados aqui.
concurrency:
  group: ${{ github.event.schedule == '17,47 * * * *' && 'email-reserva' || 'email-casa' }}
  cancel-in-progress: false
jobs:
  turno:
    if: github.event.schedule != '17,47 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      VISAO_MODELO: qwen3vl-4b
      VISAO_CACHE: /home/runner/.cache/visao-casa
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Restaura a visão local (cache do modelo)
        id: cache-visao
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/visao-casa
          key: visao-${{ env.VISAO_MODELO }}-b11635-v1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm install --no-save imapflow@2.4.3 nodemailer@10.1.1
      - run: |
          # 🧰 v12.7: ferramentas Python (voz, OCR, olho) e a visão local ficam prontas em 2º plano — o escutador
          # já atende e-mail de texto; e-mail com anexo espera o marcador /tmp/ferramentas-prontas
          (
            python3 -m pip install --quiet --disable-pip-version-check --break-system-packages "numpy<2.5" Pillow pillow-heif==1.8.1 openpyxl==3.1.5 fpdf2==2.8.9 edge-tts gTTS vosk soundfile pywhispercpp pypdf python-docx opencv-python-headless==4.10.0.84 || python3 -m pip install --quiet --disable-pip-version-check "numpy<2.5" Pillow pillow-heif==1.8.1 openpyxl==3.1.5 fpdf2==2.8.9 edge-tts gTTS vosk soundfile pywhispercpp pypdf python-docx opencv-python-headless==4.10.0.84 || true
            faltam=""
            command -v ffmpeg >/dev/null || faltam="$faltam ffmpeg"
            command -v espeak-ng >/dev/null || faltam="$faltam espeak-ng"
            command -v pdftotext >/dev/null || faltam="$faltam poppler-utils"
            tesseract --list-langs 2>/dev/null | grep -qx por || faltam="$faltam tesseract-ocr tesseract-ocr-por"
            if [ -n "$faltam" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq $faltam || true; fi
            touch /tmp/ferramentas-prontas
            python3 tools/visao-local.py --preparar
          ) > /tmp/preparo.log 2>&1 &
          export FERRAMENTAS_MARCADOR=/tmp/ferramentas-prontas
          node tools/email-poll.js
        env:
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDR }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
          CHAT_DONO: ${{ secrets.CHAT_DONO }}
          CHAT_REMETENTES: ${{ secrets.CHAT_REMETENTES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PAREAR: ${{ secrets.TELEGRAM_PAREAR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salva o log
        run: |
          set +e
          git config user.name "email-casa"
          git config user.email "email@rebocl.local"
          if [ -f email-log.md ]; then
            n=$(git show HEAD:email-log.md 2>/dev/null | wc -l)
            tail -n +$((n + 1)) email-log.md > /tmp/sessao-log.md
            if [ -s /tmp/sessao-log.md ]; then
              # 15/10: o push era recusado ("fetch first") porque o main anda durante as ~6 h do turno, e o log sumia.
              # Agora: sincroniza com o main de AGORA, anexa só as linhas desta sessão e tenta de novo se precisar.
              salvo=0
              for i in 1 2 3 4 5; do
                git fetch -q origin main && git reset -q --hard origin/main
                git ls-files --error-unmatch email-log.md >/dev/null 2>&1 || rm -f email-log.md   # ainda não versionado: começa do zero
                cat /tmp/sessao-log.md >> email-log.md
                git add email-log.md
                if git commit -q -m "email respondido $(date -u +%F-%H%M)" && git push -q origin HEAD:main; then
                  echo "📒 log salvo ($(wc -l < /tmp/sessao-log.md) linha(s) desta sessão)"; salvo=1; break
                fi
                echo "push recusado (tentativa $i) — sincronizo e tento de novo"; sleep $((i * 4))
              done
              [ "$salvo" = 1 ] || echo "⚠️ não consegui salvar o log desta sessão"
            else
              echo "nada novo no log desta sessão"
            fi
          fi
      - name: Visão local pronta?
        id: visao-pronta
        if: always()
        run: |
          tail -n 40 /tmp/preparo.log 2>/dev/null || echo "(sem log de preparo)"
          if ls /home/runner/.cache/visao-casa/.pronto-* >/dev/null 2>&1; then echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: Guarda a visão local (cache do modelo)
        if: always() && steps.cache-visao.outputs.cache-hit != 'true' && steps.visao-pronta.outputs.ok == '1'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/visao-casa
          key: visao-${{ env.VISAO_MODELO }}-b11635-v1
  # Esta agenda é uma corretora, não um segundo leitor de IMAP. Se a corrente já existe,
  # termina sem tocar na caixa; se ela sumiu e a API confirma isso, pede o mesmo turno longo.
  reserva:
    if: github.event.schedule == '17,47 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Coordena a reserva sem disputar a caixa
        run: node tools/reserva-turno.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
