name: Chat por email (24h vivo)
on:
  schedule:
    - cron: '0 */6 * * *'
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: email-casa
  cancel-in-progress: false
jobs:
  turno:
    if: github.event.schedule != '*/30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save imapflow nodemailer
      - run: node tools/email-poll.js
        env:
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDR }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
      - name: Salva o log
        run: |
          git config user.name "email-casa"
          git config user.email "email@rebocl.local"
          if [ -f email-log.md ]; then git add email-log.md; git diff --cached --quiet || git commit -m "email respondido $(date -u +%F-%H%M)" && git push || true; fi
  reserva:
    if: github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save imapflow nodemailer
      - run: node tools/email-chat.js
        env:
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDR }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
      - name: Salva o log
        run: |
          git config user.name "email-casa"
          git config user.email "email@rebocl.local"
          if [ -f email-log.md ]; then git add email-log.md; git diff --cached --quiet || git commit -m "email respondido $(date -u +%F-%H%M)" && git push || true; fi
