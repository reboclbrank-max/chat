name: Chat por email (24h vivo)
on:
  schedule:
    - cron: '7 */6 * * *'
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: email-casa
  cancel-in-progress: false
jobs:
  turno:
    if: github.event.schedule != '17,47 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save imapflow nodemailer
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages "numpy<2.5" Pillow edge-tts gTTS vosk soundfile pywhispercpp pypdf python-docx || python3 -m pip install --quiet --disable-pip-version-check "numpy<2.5" Pillow edge-tts gTTS vosk soundfile pywhispercpp pypdf python-docx || true
          faltam=""
          command -v ffmpeg >/dev/null || faltam="$faltam ffmpeg"
          command -v espeak-ng >/dev/null || faltam="$faltam espeak-ng"
          command -v pdftotext >/dev/null || faltam="$faltam poppler-utils"
          if [ -n "$faltam" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq $faltam || true; fi
      - run: node tools/email-poll.js
        env:
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDR }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salva o log
        run: |
          git config user.name "email-casa"
          git config user.email "email@rebocl.local"
          if [ -f email-log.md ]; then git add email-log.md; git diff --cached --quiet || git commit -m "email respondido $(date -u +%F-%H%M)" && git push || true; fi
  reserva:
    if: github.event.schedule == '17,47 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save imapflow nodemailer
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages "numpy<2.5" Pillow edge-tts gTTS vosk soundfile pywhispercpp pypdf python-docx || python3 -m pip install --quiet --disable-pip-version-check "numpy<2.5" Pillow edge-tts gTTS vosk soundfile pywhispercpp pypdf python-docx || true
          faltam=""
          command -v ffmpeg >/dev/null || faltam="$faltam ffmpeg"
          command -v espeak-ng >/dev/null || faltam="$faltam espeak-ng"
          command -v pdftotext >/dev/null || faltam="$faltam poppler-utils"
          if [ -n "$faltam" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq $faltam || true; fi
      - run: node tools/email-chat.js
        env:
          GMAIL_CHAT_ADDR: ${{ secrets.GMAIL_CHAT_ADDR }}
          GMAIL_CHAT_PASS: ${{ secrets.GMAIL_CHAT_PASS }}
      - name: Acorda o vigia da casa
        run: |
          curl -s -o /dev/null -w "vigia: %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/reboclbrank-max/chat/actions/workflows/vigia.yml/dispatches \
            -d '{"ref":"main"}' || true
      - name: Salva o log
        run: |
          git config user.name "email-casa"
          git config user.email "email@rebocl.local"
          if [ -f email-log.md ]; then git add email-log.md; git diff --cached --quiet || git commit -m "email respondido $(date -u +%F-%H%M)" && git push || true; fi
