name: Evolução do chat (bateria diária)
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      amostra:
        description: "Identificador público e sanitizado de uma amostra extraordinária"
        required: false
        type: string
permissions:
  contents: write
jobs:
  exame:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: node tools/evolucao-chat.js
        env:
          EVOLUCAO_AMOSTRA: ${{ inputs.amostra }}
      - name: Calcula o indicador com o vigia recém-sincronizado
        run: |
          # O checkout pode ter começado antes do vigia publicar uma sonda. Leia a fonte
          # remota imediatamente antes do indicador para não promover um verde ultrapassado.
          git fetch -q origin main
          git show origin/main:vigia-estado.json > vigia-estado.json
          node tools/indice-capacidade.js
          git checkout -- vigia-estado.json
      - name: Salva o histórico
        run: |
          git config user.name "evolucao-casa"
          git config user.email "evolucao@rebocl.local"
          git add saude-cerebro.md qualidade-historico.json capacidade-estado.json CAPACIDADE.md
          git diff --cached --quiet || git commit -m "exame diario $(date -u +%F)"
          ok=0
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main || true
            if git push; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "push falhou apos 3 tentativas"; exit 1; }
