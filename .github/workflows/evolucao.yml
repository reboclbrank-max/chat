name: Evolução do chat (bateria diária)
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      amostra:
        description: "Identificador público e sanitizado de uma amostra extraordinária"
        required: false
        type: string
permissions:
  contents: write
# Uma única bateria preserva a sequência de qualidade/indicador; a publicação
# ainda valida conflito por arquivo antes de tocar no ramo de estado.
concurrency:
  group: evolucao-chat
  cancel-in-progress: false
jobs:
  exame:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Restaura a fotografia sanitizada do ramo revisável
        run: node tools/estado-operacional-controlado.js preparar evolucao
      - run: node tools/evolucao-chat.js
        env:
          EVOLUCAO_AMOSTRA: ${{ inputs.amostra }}
      - name: Calcula o indicador com o vigia recém-sincronizado
        run: |
          # O checkout pode ter começado antes de o vigia publicar a sonda. A
          # leitura é refeita na referência de estado, nunca em main.
          node tools/estado-operacional-controlado.js atualizar-vigia evolucao
          node tools/indice-capacidade.js
      - name: Publica somente o histórico no ramo revisável
        run: |
          set -euo pipefail
          git config user.name "evolucao-casa"
          git config user.email "evolucao@rebocl.local"
          git add -- saude-cerebro.md qualidade-historico.json capacidade-estado.json CAPACIDADE.md
          if git diff --cached --quiet; then
            echo "indicador sem alteração publicável"
          else
            node tools/estado-operacional-controlado.js publicar evolucao
          fi
